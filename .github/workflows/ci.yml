name: CI and local cluster delivery
on:
 push:
  branches: [main]
 pull_request:
 workflow_dispatch:
permissions:
 contents: read
concurrency:
 group: ci-${{ github.ref }}
 cancel-in-progress: true
jobs:
 test:
  runs-on: ubuntu-latest
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-go@v5
     with: {go-version-file: go.mod}
   - uses: actions/setup-node@v4
     with: {node-version: '24'}
   - name: Go checks
     run: |
      test -z "$(gofmt -l cmd internal)"
      go vet ./...
      go test -race ./...
   - name: JavaScript checks
     run: |
      node --check web/app.js
      node --check simulator/main.mjs
      node --test simulator/*.test.mjs
   - name: Compose deployment and integration
     run: |
      node scripts/setup.mjs
      docker compose config -q
      docker compose up -d --build --wait --scale dispatcher=2
      node scripts/smoke.mjs
      docker compose stop redis
      node scripts/smoke.mjs
      docker compose start redis
   - uses: azure/setup-helm@v4.3.0
     with: {version: 'v3.17.4'}
   - name: Install k3d
     run: |
      curl -fsSL https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64 -o /usr/local/bin/k3d
      chmod +x /usr/local/bin/k3d
   - name: Deliver to temporary Kubernetes cluster
     run: |
      helm lint deploy/helm/taxi
      cmp deploy/nginx.conf deploy/helm/taxi/files/nginx.conf
      k3d cluster create --config deploy/k3d.yaml
      k3d image import taxi-app:local taxi-web:local taxi-simulator:local -c taxi
      export KUBECONFIG="$(k3d kubeconfig write taxi)"
      kubectl create namespace taxi
      node scripts/kube-secret.mjs | kubectl apply -f -
      helm upgrade --install taxi deploy/helm/taxi -n taxi --wait --timeout 180s
      kubectl get pods -n taxi -o wide
      BASE_URL=http://127.0.0.1:8089 HOST_HEADER=taxi.localhost node scripts/smoke.mjs
   - name: Diagnostics on failure
     if: failure()
     run: |
      docker compose logs --tail=80
      docker exec k3d-taxi-server-0 kubectl get pods -A || true
   - name: Cleanup
     if: always()
     run: |
      docker compose down
      k3d cluster delete taxi || true
 publish:
  if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  needs: test
  runs-on: ubuntu-latest
  permissions:
   contents: read
   packages: write
  strategy:
   matrix:
    include:
     - {component: app, dockerfile: deploy/Dockerfile.backend}
     - {component: web, dockerfile: deploy/Dockerfile.web}
     - {component: simulator, dockerfile: deploy/Dockerfile.simulator}
  steps:
   - uses: actions/checkout@v4
   - uses: docker/setup-qemu-action@v3
   - uses: docker/setup-buildx-action@v3
   - name: Image namespace
     run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
   - uses: docker/login-action@v3
     with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}
   - uses: docker/build-push-action@v6
     with:
      context: .
      file: ${{ matrix.dockerfile }}
      platforms: linux/amd64,linux/arm64
      push: true
      tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:${{ github.sha }}
      cache-from: type=gha,scope=${{ matrix.component }}
      cache-to: type=gha,mode=max,scope=${{ matrix.component }}
