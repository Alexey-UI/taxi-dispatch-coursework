apiVersion: v1
kind: Service
metadata: {name: postgres}
spec:
 selector: {app: postgres, project: taxi}
 ports: [{port: 5432, targetPort: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: {name: postgres}
spec:
 serviceName: postgres
 replicas: 1
 selector:
  matchLabels: {app: postgres, project: taxi}
 template:
  metadata:
   labels: {app: postgres, project: taxi}
  spec:
   automountServiceAccountToken: false
   securityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    seccompProfile: {type: RuntimeDefault}
   containers:
    - name: postgres
      image: postgres:17-alpine
      securityContext:
       allowPrivilegeEscalation: false
       capabilities: {drop: [ALL]}
      env:
       - {name: POSTGRES_USER, value: taxi}
       - {name: POSTGRES_DB, value: taxi}
       - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}
       - name: POSTGRES_PASSWORD
         valueFrom:
          secretKeyRef: {name: {{ .Values.existingSecret }}, key: POSTGRES_PASSWORD}
      ports: [{containerPort: 5432}]
      readinessProbe:
       exec: {command: [pg_isready, -U, taxi, -d, taxi]}
       periodSeconds: 5
      resources:
       requests: {cpu: 100m, memory: 128Mi}
       limits: {cpu: "1", memory: 512Mi}
      volumeMounts:
       - {name: data, mountPath: /var/lib/postgresql/data}
 volumeClaimTemplates:
  - metadata: {name: data}
    spec:
     accessModes: [ReadWriteOnce]
     storageClassName: {{ .Values.storage.className | quote }}
     resources:
      requests: {storage: {{ .Values.storage.size }}}
---
apiVersion: v1
kind: Service
metadata: {name: redis}
spec:
 selector: {app: redis, project: taxi}
 ports: [{port: 6379, targetPort: 6379}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: redis}
spec:
 replicas: 1
 selector:
  matchLabels: {app: redis, project: taxi}
 template:
  metadata:
   labels: {app: redis, project: taxi}
  spec:
   automountServiceAccountToken: false
   securityContext:
    runAsNonRoot: true
    runAsUser: 999
    seccompProfile: {type: RuntimeDefault}
   containers:
    - name: redis
      image: redis:7.4-alpine
      command: [redis-server, --save, "", --appendonly, "no"]
      ports: [{containerPort: 6379}]
      securityContext:
       allowPrivilegeEscalation: false
       readOnlyRootFilesystem: true
       capabilities: {drop: [ALL]}
      readinessProbe:
       exec: {command: [redis-cli, ping]}
       periodSeconds: 5
      resources:
       requests: {cpu: 25m, memory: 32Mi}
       limits: {cpu: 250m, memory: 128Mi}
