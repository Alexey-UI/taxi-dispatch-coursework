worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
 include /etc/nginx/mime.types;
 types { application/javascript mjs; }
 default_type application/octet-stream;
 log_format json escape=json '{"time":"$time_iso8601","service":"web","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time,"request_id":"$request_id"}';
 access_log /dev/stdout json;
 client_body_temp_path /tmp/client_temp;
 proxy_temp_path /tmp/proxy_temp;
 fastcgi_temp_path /tmp/fastcgi_temp;
 uwsgi_temp_path /tmp/uwsgi_temp;
 scgi_temp_path /tmp/scgi_temp;
 # Trust only the K3s Pod CIDR; Traefik sanitizes untrusted forwarded headers.
 set_real_ip_from 10.42.0.0/16;
 real_ip_header X-Forwarded-For;
 real_ip_recursive on;
 server_tokens off;
 client_max_body_size 8k;
 limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
 limit_req_zone $binary_remote_addr zone=login_limit:1m rate=5r/m;
 limit_req_status 429;
 upstream backend { server api:8080; keepalive 16; }
 server {
  listen 8080;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'" always;
  location = /healthz { access_log off; return 200 'ok'; }
  location = /api/auth/login {
   limit_req zone=login_limit burst=3 nodelay;
   proxy_pass http://backend;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
  }
  location /api/ {
   limit_req zone=api_limit burst=25 nodelay;
   proxy_pass http://backend;
   proxy_http_version 1.1;
   proxy_set_header Connection "";
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_connect_timeout 3s;
   proxy_read_timeout 10s;
  }
  location / { try_files $uri $uri/ /index.html; }
 }
}
